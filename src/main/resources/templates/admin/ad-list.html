<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="#{admin.ads.list}">Ad Management</title>
</head>

<body>
    <main layout:fragment="content" class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 th:text="#{admin.ads.list}">Ad Management</h1>
                    <a th:href="@{/admin/ads/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> <span th:text="#{admin.ads.create}">Create New Ad</span>
                    </a>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div th:if="${ads.isEmpty()}" class="text-center py-5">
                            <i class="bi bi-inbox display-1 text-muted"></i>
                            <p class="mt-3 text-muted" th:text="#{admin.ads.no_ads}">No ad configurations found. Create
                                your first ad to get started.</p>
                            <a th:href="@{/admin/ads/new}" class="btn btn-primary mt-2">
                                <i class="bi bi-plus-circle"></i> <span th:text="#{admin.ads.create}">Create New
                                    Ad</span>
                            </a>
                        </div>

                        <div th:if="${!ads.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th th:text="#{admin.ads.name}">Ad Name</th>
                                        <th th:text="#{admin.ads.position}">Position</th>
                                        <th th:text="#{admin.ads.client_id}">Client ID</th>
                                        <th th:text="#{admin.ads.slot_id}">Slot ID</th>
                                        <th th:text="#{admin.ads.format}">Format</th>
                                        <th th:text="#{admin.ads.status}">Status</th>
                                        <th th:text="#{admin.ads.actions}">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ad : ${ads}">
                                        <td th:text="${ad.adName}">Home Banner</td>
                                        <td>
                                            <span class="badge bg-info" th:text="${ad.adPosition.displayName}">Home
                                                Top</span>
                                        </td>
                                        <td>
                                            <code class="small" th:text="${ad.adClient}">ca-pub-xxxxx</code>
                                        </td>
                                        <td>
                                            <code class="small" th:text="${ad.adSlot}">1234567890</code>
                                        </td>
                                        <td th:text="${ad.adFormat}">auto</td>
                                        <td>
                                            <span th:if="${ad.isActive}" class="badge bg-success"
                                                th:text="#{admin.ads.active}">Active</span>
                                            <span th:unless="${ad.isActive}" class="badge bg-secondary"
                                                th:text="#{admin.ads.inactive}">Inactive</span>
                                        </td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <a th:href="@{/admin/ads/{id}/edit(id=${ad.id})}"
                                                    class="btn btn-sm btn-outline-primary" th:title="#{common.edit}">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <form th:action="@{/admin/ads/{id}/toggle(id=${ad.id})}" method="post"
                                                    style="display: inline;">
                                                    <button type="submit" class="btn btn-sm btn-outline-warning"
                                                        th:title="${ad.isActive ? 'Disable' : 'Enable'}">
                                                        <i
                                                            th:class="${ad.isActive ? 'bi bi-toggle-on' : 'bi bi-toggle-off'}"></i>
                                                    </button>
                                                </form>
                                                <form th:action="@{/admin/ads/{id}/delete(id=${ad.id})}" method="post"
                                                    style="display: inline;"
                                                    onsubmit="return confirm(window.i18n.deleteConfirm || 'Are you sure?');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                                        th:title="#{common.delete}">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> <span th:text="#{common.back}">Back to Dashboard</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
