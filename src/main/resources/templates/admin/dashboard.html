<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="#{admin.dashboard.title}">Admin Dashboard</title>
</head>

<body>
    <div layout:fragment="content">
        <h1 class="mb-4"><i class="bi bi-speedometer2"></i> <span th:text="#{admin.dashboard.title}">Admin
                Dashboard</span></h1>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-uppercase" th:text="#{admin.dashboard.total_trends}">Total
                                    Trends</h6>
                                <h2 class="mb-0" th:text="${totalTrends}">0</h2>
                            </div>
                            <i class="bi bi-stars" style="font-size: 3rem; opacity: 0.5;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-uppercase" th:text="#{admin.dashboard.total_users}">Total
                                    Users</h6>
                                <h2 class="mb-0" th:text="${totalUsers}">0</h2>
                            </div>
                            <i class="bi bi-people" style="font-size: 3rem; opacity: 0.5;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-uppercase" th:text="#{admin.dashboard.generated_images}">
                                    Generated Images</h6>
                                <h2 class="mb-0" th:text="${totalGeneratedImages}">0</h2>
                            </div>
                            <i class="bi bi-images" style="font-size: 3rem; opacity: 0.5;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0 h5"><i class="bi bi-lightning"></i> <span
                                th:text="#{admin.dashboard.quick_actions}">Quick Actions</span></h2>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2 d-md-flex">
                            <a th:href="@{/admin/trends/new}" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> <span
                                    th:text="#{admin.dashboard.create_new_trend}">Create New Trend</span>
                            </a>
                            <a th:href="@{/admin/trends}" class="btn btn-outline-primary">
                                <i class="bi bi-list-ul"></i> <span th:text="#{admin.dashboard.manage_trends}">Manage
                                    Trends</span>
                            </a>
                            <a th:href="@{/admin/ads}" class="btn btn-outline-success">
                                <i class="bi bi-badge-ad"></i> <span th:text="#{admin.dashboard.manage_ads}">Manage
                                    Ads</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
