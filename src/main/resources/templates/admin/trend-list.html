<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="#{admin.trends.manage}">Manage Trends</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-list-ul"></i> <span th:text="#{admin.trends.manage}">Manage Trends</span></h1>
            <a th:href="@{/admin/trends/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> <span th:text="#{admin.trends.create_new}">Create New Trend</span>
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" th:if="${trends != null and trends.hasContent()}">
                        <thead>
                            <tr>
                                <th th:text="#{admin.trends.id}">ID</th>
                                <th th:text="#{admin.trends.name}">Name</th>
                                <th th:text="#{admin.trends.category}">Category</th>
                                <th th:text="#{admin.trends.status}">Status</th>
                                <th th:text="#{admin.trends.usage_count}">Usage Count</th>
                                <th th:text="#{admin.trends.created}">Created</th>
                                <th th:text="#{admin.trends.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="trend : ${trends.content}">
                                <td th:text="${trend.id}">1</td>
                                <td th:text="${trend.trendName}">Trend Name</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${trend.category}">Category</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${trend.status.name() == 'ACTIVE'} ? 'bg-success' : (${trend.status.name() == 'INACTIVE'} ? 'bg-danger' : 'bg-warning')"
                                          th:text="${trend.status}">Status</span>
                                </td>
                                <td th:text="${trend.usageCount}">0</td>
                                <td th:text="${#temporals.format(trend.createdAt, 'dd/MM/yyyy')}">Date</td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/admin/trends/{id}/edit(id=${trend.id})}" 
                                           class="btn btn-outline-primary" th:title="#{admin.trends.edit_button}">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/admin/trends/{id}/test(id=${trend.id})}" 
                                           class="btn btn-outline-info" th:title="#{admin.trends.test_button}">
                                            <i class="bi bi-flask"></i>
                                        </a>
                                        <form th:action="@{/admin/trends/{id}/delete(id=${trend.id})}" 
                                              method="post" style="display: inline;"
                                              th:onsubmit="return confirm('#{admin.trends.delete_confirm}');">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" th:title="#{admin.trends.delete_button}">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="alert alert-info" th:if="${trends == null or !trends.hasContent()}">
                    <i class="bi bi-info-circle"></i> <span th:text="#{admin.trends.no_trends}">No trends found. Create your first trend!</span>
                </div>

                <!-- Pagination -->
                <nav aria-label="Page navigation" th:if="${trends != null and trends.totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${trends.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/trends(page=${trends.number - 1})}" th:text="#{admin.trends.previous}">Previous</a>
                        </li>
                        <li class="page-item" 
                            th:each="i : ${#numbers.sequence(0, trends.totalPages - 1)}"
                            th:classappend="${i == trends.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/trends(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${trends.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/trends(page=${trends.number + 1})}" th:text="#{admin.trends.next}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
