<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="#{error.404.title}">Page Not Found</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="text-center py-5">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
            <h1 class="display-1">404</h1>
            <h2 th:text="#{error.404.heading}">Page Not Found</h2>
            <p class="lead" th:text="#{error.404.message}">The page you are looking for doesn't exist or has been moved.</p>
            <p th:if="${error}" class="text-danger" th:text="${error}">Error message</p>
            <a th:href="@{/}" class="btn btn-primary mt-3">
                <i class="bi bi-house"></i> <span th:text="#{common.go_home}">Go Home</span>
            </a>
        </div>
    </div>
</body>
</html>
