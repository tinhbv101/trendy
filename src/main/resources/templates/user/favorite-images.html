<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>My Favorite Images</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-heart-fill text-danger"></i> My Favorite Images</h1>
            <a href="/gallery" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Gallery
            </a>
        </div>

        <!-- Results Summary -->
        <div th:if="${favoriteImages != null and favoriteImages.hasContent()}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> 
            Showing <strong th:text="${favoriteImages.numberOfElements}">0</strong> of 
            <strong th:text="${totalFavoriteImages}">0</strong> favorite images
        </div>

        <!-- Empty State -->
        <div th:if="${favoriteImages == null or !favoriteImages.hasContent()}" class="text-center py-5">
            <i class="bi bi-heart" style="font-size: 4rem; color: #ccc;"></i>
            <h3 class="mt-3">No Favorite Images Yet</h3>
            <p class="text-muted">Start adding images to your favorites from the gallery!</p>
            <a href="/gallery" class="btn btn-primary mt-3">
                <i class="bi bi-images"></i> Go to Gallery
            </a>
        </div>

        <!-- Images Grid -->
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" th:if="${favoriteImages != null and favoriteImages.hasContent()}">
            <div class="col" th:each="favoriteImage, iterStat : ${favoriteImages.content}">
                <div class="card h-100">
                    <!-- Display generated image -->
                    <div th:if="${favoriteImage.generatedImage.status.name() == 'COMPLETED' and favoriteImage.generatedImage.outputImagePath != null}" 
                         style="height: 200px; overflow: hidden;">
                        <img th:src="@{/images/{filename}(filename=${favoriteImage.generatedImage.outputImagePath})}" 
                             class="card-img-top" 
                             alt="Generated image"
                             th:attr="loading=${iterStat.first ? 'eager' : 'lazy'}, fetchpriority=${iterStat.first ? 'high' : null}"
                             decoding="async"
                             width="400"
                             height="200"
                             sizes="(max-width: 576px) 100vw, (max-width: 768px) 50vw, (max-width: 992px) 33vw, 25vw"
                             style="width: 100%; height: 200px; object-fit: cover;">
                    </div>
                    <!-- Placeholder for other statuses -->
                    <div th:if="${favoriteImage.generatedImage.status.name() != 'COMPLETED' or favoriteImage.generatedImage.outputImagePath == null}"
                         class="card-img-top bg-secondary d-flex align-items-center justify-content-center" 
                         style="height: 200px;">
                        <div class="text-center">
                            <i class="bi bi-image text-white" style="font-size: 3rem;"></i>
                            <p class="text-white small mt-2" th:text="${favoriteImage.generatedImage.status}">Status</p>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title h6" th:text="${favoriteImage.generatedImage.trend.trendName}">Trend Name</h3>
                        <p class="card-text small text-muted">
                            <i class="bi bi-calendar"></i> Created: <span th:text="${#temporals.format(favoriteImage.generatedImage.createdAt, 'dd/MM/yyyy')}">Date</span><br>
                            <i class="bi bi-heart-fill text-danger"></i> Favorited: <span th:text="${#temporals.format(favoriteImage.createdAt, 'dd/MM/yyyy')}">Date</span>
                        </p>
                        <span class="badge" 
                              th:classappend="${favoriteImage.generatedImage.status.name() == 'COMPLETED'} ? 'bg-success' : (${favoriteImage.generatedImage.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-warning')"
                              th:text="${favoriteImage.generatedImage.status}">Status</span>
                    </div>
                    <div class="card-footer bg-transparent">
                        <div class="d-flex gap-1">
                            <a th:href="@{/generate/result/{id}(id=${favoriteImage.generatedImage.id})}" 
                               class="btn btn-outline-primary btn-sm flex-grow-1"
                               title="View details">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <!-- Remove from favorites button -->
                            <button type="button" 
                                    class="btn btn-danger btn-sm favorite-btn" 
                                    th:attr="data-image-id=${favoriteImage.generatedImage.id}"
                                    onclick="removeFavoriteImage(this)"
                                    title="Remove from favorites">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                            <!-- Desktop: Download button -->
                            <a th:if="${favoriteImage.generatedImage.status.name() == 'COMPLETED' and favoriteImage.generatedImage.outputImagePath != null}"
                               th:href="@{/images/download/{filename}(
                                    filename=${favoriteImage.generatedImage.outputImagePath},
                                    name=${favoriteImage.generatedImage.trend.trendName.replaceAll('[^a-zA-Z0-9-_]', '-').toLowerCase() + '-' + 
                                          #temporals.format(favoriteImage.generatedImage.createdAt, 'yyyyMMdd') + 
                                          (favoriteImage.generatedImage.outputImagePath.contains('.png') ? '.png' : '.jpg')}
                                )}" 
                               class="btn btn-outline-success btn-sm d-none d-md-inline-block"
                               title="Download image">
                                <i class="bi bi-download"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${favoriteImages != null and favoriteImages.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${favoriteImages.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/favorites/images(page=${favoriteImages.number - 1})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, favoriteImages.totalPages - 1)}"
                    th:classappend="${i == favoriteImages.number} ? 'active'">
                    <a class="page-link" th:href="@{/favorites/images(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${favoriteImages.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/favorites/images(page=${favoriteImages.number + 1})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            async function removeFavoriteImage(button) {
                const imageId = button.getAttribute('data-image-id');
                const card = button.closest('.col');
                
                if (!confirm('Remove this image from favorites?')) {
                    return;
                }
                
                try {
                    button.disabled = true;
                    
                    const response = await fetch(`/api/favorites/image/${imageId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Remove card with animation
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.8)';
                        card.style.transition = 'all 0.3s ease';
                        
                        setTimeout(() => {
                            card.remove();
                            
                            // Reload page if no more items on current page
                            const remainingCards = document.querySelectorAll('.col').length;
                            if (remainingCards === 0) {
                                window.location.reload();
                            }
                        }, 300);
                    } else {
                        alert(data.message || 'Failed to remove favorite');
                        button.disabled = false;
                    }
                } catch (error) {
                    console.error('Error removing favorite:', error);
                    alert('Failed to remove favorite. Please try again.');
                    button.disabled = false;
                }
            }
        </script>
    </th:block>
</body>
</html>
