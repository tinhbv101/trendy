<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="#{my_shares.title}">My Shared Links</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Define functions at the TOP of content fragment -->
        <script>
            window.copyShareLinkFromList = function(button) {
                console.log('copyShareLinkFromList called', button);
                const shareUrl = button.getAttribute('data-share-url');
                const fullUrl = window.location.origin + shareUrl;
                console.log('Full URL to copy:', fullUrl);
                
                // Try modern clipboard API first
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(fullUrl).then(() => {
                        window.updateCopyButton(button);
                    }).catch(err => {
                        console.error('Clipboard API failed:', err);
                        window.fallbackCopyInList(fullUrl, button);
                    });
                } else {
                    // Fallback for older browsers or insecure contexts
                    window.fallbackCopyInList(fullUrl, button);
                }
            };
            
            window.updateCopyButton = function(button) {
                const originalHtml = button.innerHTML;
                button.innerHTML = '<i class="bi bi-check"></i>';
                button.classList.remove('btn-outline-success');
                button.classList.add('btn-success');
                
                setTimeout(() => {
                    button.innerHTML = originalHtml;
                    button.classList.remove('btn-success');
                    button.classList.add('btn-outline-success');
                }, 2000);
            };
            
            window.fallbackCopyInList = function(text, button) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        window.updateCopyButton(button);
                    } else {
                        const failedCopyText = /*[[#{my_shares.failed_to_copy}]]*/ 'Failed to copy. Please copy manually.';
                        alert(failedCopyText);
                    }
                } catch (err) {
                    console.error('Fallback copy failed:', err);
                    const failedCopyText = /*[[#{my_shares.failed_to_copy}]]*/ 'Failed to copy. Please copy manually.';
                    alert(failedCopyText);
                }
                
                document.body.removeChild(textArea);
            };
            
            window.revokeShare = async function(button) {
                const token = button.getAttribute('data-token');
                const card = button.closest('.col');
                const revokeConfirmText = /*[[#{my_shares.revoke_confirm}]]*/ 'Revoke this share link? It will no longer be accessible.';
                
                if (!confirm(revokeConfirmText)) {
                    return;
                }
                
                try {
                    button.disabled = true;
                    button.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                    
                    const response = await fetch(`/api/share/revoke/${token}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Update badge to show revoked status
                        const badge = card.querySelector('.badge');
                        badge.classList.remove('bg-success');
                        badge.classList.add('bg-secondary');
                        badge.textContent = /*[[#{my_shares.revoked}]]*/ 'Revoked';
                        
                        // Remove revoke button
                        button.remove();
                        
                        // Show success message
                        const successText = /*[[#{my_shares.share_link_revoked}]]*/ 'Share link revoked successfully!';
                        const alertDiv = document.createElement('div');
                        alertDiv.className = 'alert alert-success alert-dismissible fade show mt-3';
                        alertDiv.innerHTML = `
                            <i class="bi bi-check-circle"></i> ${successText}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        `;
                        card.querySelector('.card-body').appendChild(alertDiv);
                        
                        setTimeout(() => alertDiv.remove(), 3000);
                    } else {
                        const failedRevokeText = /*[[#{my_shares.failed_to_revoke}]]*/ 'Failed to revoke share link';
                        alert(data.message || failedRevokeText);
                        button.disabled = false;
                        button.innerHTML = '<i class="bi bi-x-circle"></i>';
                    }
                } catch (error) {
                    console.error('Error revoking share:', error);
                    const failedRevokeText = /*[[#{my_shares.failed_to_revoke}]]*/ 'Failed to revoke share link. Please try again.';
                    alert(failedRevokeText);
                    button.disabled = false;
                    button.innerHTML = '<i class="bi bi-x-circle"></i>';
                }
            };
            
            console.log('Share functions loaded:', typeof window.copyShareLinkFromList);
        </script>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-share-fill text-success"></i> <span th:text="#{my_shares.title}">My Shared Links</span></h1>
            <a th:href="@{/gallery}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> <span th:text="#{my_shares.go_to_gallery}">Back to Gallery</span>
            </a>
        </div>

        <!-- Stats -->
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> 
            <span th:text="#{my_shares.active_shares(${activeShares})}">You have 0 active shared link(s).</span>
        </div>

        <!-- Empty State -->
        <div th:if="${shares == null or !shares.hasContent()}" class="text-center py-5">
            <i class="bi bi-share" style="font-size: 4rem; color: #ccc;"></i>
            <h3 class="mt-3" th:text="#{my_shares.no_shares}">No Shared Links Yet</h3>
            <p class="text-muted" th:text="#{my_shares.no_shares_message}">Share your generated images with others!</p>
            <a th:href="@{/gallery}" class="btn btn-primary mt-3">
                <i class="bi bi-images"></i> <span th:text="#{my_shares.go_to_gallery}">Go to Gallery</span>
            </a>
        </div>

        <!-- Shares List -->
        <div th:if="${shares != null and shares.hasContent()}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="share, iterStat : ${shares.content}">
                    <div class="card h-100">
                        <!-- Image Preview -->
                        <div style="height: 200px; overflow: hidden;">
                            <img th:src="@{/images/{filename}(filename=${share.generatedImage.outputImagePath})}" 
                                 class="card-img-top" 
                                 th:alt="#{my_shares.shared_image_alt}"
                                 th:attr="loading=${iterStat.first ? 'eager' : 'lazy'}, fetchpriority=${iterStat.first ? 'high' : null}"
                                 decoding="async"
                                 width="400"
                                 height="200"
                                 sizes="(max-width: 576px) 100vw, (max-width: 768px) 50vw, (max-width: 992px) 33vw, 25vw"
                                 style="width: 100%; height: 200px; object-fit: cover;">
                        </div>
                        
                        <div class="card-body" th:with="activeLabel=#{my_shares.active}, revokedLabel=#{my_shares.revoked}, expiredLabel=#{my_shares.expired}">
                            <h3 class="card-title h6" th:text="${share.generatedImage.trend.trendName}">Trend Name</h3>
                            
                            <div class="small text-muted mb-2">
                                <div><i class="bi bi-calendar"></i> <span th:text="|#{my_shares.shared_label}#{common.colon}|">Shared:</span>
                                    <span th:text="${#temporals.format(share.createdAt, 'dd/MM/yyyy')}">Date</span>
                                </div>
                                <div th:if="${share.expiresAt != null}">
                                    <i class="bi bi-clock"></i> <span th:text="|#{my_shares.expires}#{common.colon}|">Expires:</span>
                                    <span th:text="${#temporals.format(share.expiresAt, 'dd/MM/yyyy')}">Date</span>
                                </div>
                                <div><i class="bi bi-eye"></i> <span th:text="|#{my_shares.views}#{common.colon}|">Views:</span> <span th:text="${share.viewCount}">0</span></div>
                            </div>
                            
                            <!-- Status Badge -->
                            <span class="badge" 
                                  th:classappend="${share.isActive and !share.isExpired()} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${share.isActive ? (share.isExpired() ? expiredLabel : activeLabel) : revokedLabel}">
                                Status
                            </span>
                        </div>
                        
                        <div class="card-footer bg-transparent">
                            <div class="d-flex gap-1">
                                <!-- View Button -->
                                <a th:href="@{/share/{token}(token=${share.shareToken})}" 
                                   class="btn btn-outline-primary btn-sm flex-grow-1"
                                   target="_blank"
                                   th:title="#{common.view}">
                                    <i class="bi bi-eye"></i> <span th:text="#{common.view}">View</span>
                                </a>
                                
                                <!-- Copy Link Button -->
                                <button type="button" 
                                        class="btn btn-outline-success btn-sm"
                                        th:attr="data-share-url=@{/share/{token}(token=${share.shareToken})}"
                                        onclick="copyShareLinkFromList(this)"
                                        th:title="#{my_shares.copy_link}">
                                    <i class="bi bi-link-45deg"></i>
                                </button>
                                
                                <!-- Revoke Button -->
                                <button type="button" 
                                        class="btn btn-outline-danger btn-sm"
                                        th:if="${share.isActive}"
                                        th:attr="data-token=${share.shareToken}"
                                        onclick="revokeShare(this)"
                                        th:title="#{my_shares.revoke}">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Pagination -->
            <nav th:if="${shares.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${shares.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/my-shares(page=${shares.number - 1})}" th:attr="aria-label=#{common.previous}">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, shares.totalPages - 1)}"
                        th:classappend="${i == shares.number} ? 'active'">
                        <a class="page-link" th:href="@{/my-shares(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${shares.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/my-shares(page=${shares.number + 1})}" th:attr="aria-label=#{common.next}">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <th:block layout:fragment="extra-scripts">
        <!-- Functions already defined in body -->
    </th:block>
</body>
</html>
