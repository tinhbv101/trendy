<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${trend.trendName + ' - Trendy'}">Trend Detail - Trendy</title>
    <th:block th:fragment="extra-head">
        <meta name="description" th:content="'Create amazing images with ' + ${trend.trendName} + ' style. ' + ${trend.description} + ' Transform your photos with AI-powered trends using Trendy.'">
        <meta property="og:title" th:content="${trend.trendName + ' - Trendy'}">
        <meta property="og:description" th:content="'Create amazing images with ' + ${trend.trendName} + ' style. ' + ${trend.description}">
        <meta name="twitter:title" th:content="${trend.trendName + ' - Trendy'}">
        <meta name="twitter:description" th:content="'Create amazing images with ' + ${trend.trendName} + ' style. ' + ${trend.description}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{trend_detail.breadcrumb_home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/trends}" th:text="#{trend_detail.breadcrumb_trends}">Trends</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${trend.trendName}">Trend</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-md-8">
                <h1 th:text="${trend.trendName}">Trend Name</h1>
                
                <div class="mb-3">
                    <span class="badge bg-primary me-2" th:text="${trend.category}">Category</span>
                    <span class="badge bg-success" th:text="${trend.status}">Status</span>
                </div>

                <p class="lead" th:text="${trend.description}">Description goes here...</p>

                <div class="card mb-3">
                    <div class="card-body">
                        <h2 class="card-title h5"><i class="bi bi-info-circle"></i> <span th:text="#{trend_detail.details}">Details</span></h2>
                        <ul class="list-unstyled">
                            <li><strong th:text="#{trend_detail.max_input_images} + ':'">Max Input Images:</strong> <span th:text="${trend.maxInputImages}">1</span></li>
                            <li><strong th:text="#{trend_detail.output_size} + ':'">Output Size:</strong> <span th:text="${trend.aspectRatioDisplay} + ' (' + ${trend.outputWidth} + 'x' + ${trend.outputHeight} + ')'">Square (1024x1024)</span></li>
                            <li><strong th:text="#{trend_detail.ai_model} + ':'">AI Model:</strong> <span class="text-muted" th:text="${trend.aiModel.displayName}">Google Gemini 2.5 Flash Image</span></li>
                            <li><strong th:text="#{trend_detail.times_used} + ':'">Times Used:</strong> <span th:text="${trend.usageCount}">0</span></li>
                        </ul>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <a th:href="@{/generate/{id}(id=${trend.id})}" 
                       class="btn btn-primary btn-lg" 
                       sec:authorize="isAuthenticated()">
                        <i class="bi bi-magic"></i> <span th:text="#{trend_detail.create_my_image}">Create My Image</span>
                    </a>
                    <a th:href="@{/login}" 
                       class="btn btn-primary btn-lg" 
                       sec:authorize="!isAuthenticated()">
                        <i class="bi bi-box-arrow-in-right"></i> <span th:text="#{trend_detail.login_to_create}">Login to Create</span>
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <h2 class="h5" th:text="#{trend_detail.example_images}">Example Images</h2>
                <div th:if="${examples != null and !examples.isEmpty()}">
                    <div th:each="example, iterStat : ${examples}" class="card mb-3">
                        <img th:src="@{/images/{filename}(filename=${example.imagePath})}" 
                             class="card-img-top" 
                             alt="Example image"
                             th:attr="loading=${iterStat.first ? 'eager' : 'lazy'}, fetchpriority=${iterStat.first ? 'high' : null}"
                             decoding="async"
                             style="max-height: 300px; object-fit: cover;">
                    </div>
                </div>
                <div th:if="${examples == null or examples.isEmpty()}" class="card">
                    <div class="card-body text-center bg-light" style="min-height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                        <i class="bi bi-image text-muted" style="font-size: 4rem;"></i>
                        <p class="mt-3 text-muted" th:text="#{trend_detail.no_examples}">No example images yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
